<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2756">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recibos">
<title>Recibos de Clases</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
/* Una columna tipo talonario; el recibo es una hoja con borde troquelado. */
:root{
  --paper:#F5F7FB; --sheet:#FFFFFF; --ink:#1B2756; --muted:#5E6786; --line:#D9DEEB;
  --accent:#2E57E0; --on-accent:#FFFFFF; --accent-soft:#E3E9FC; --ok:#17805A; --ok-soft:#DDF2E8; --warn:#A8661A; --warn-soft:#FBEEDB;
  --off:#9AA2BC; --hatch:#E7EAF2; --danger:#C2412D;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F1320; --sheet:#171C2C; --ink:#E5E9F7; --muted:#A0A8C4; --line:#2B3350;
  --accent:#7D9BFF; --on-accent:#0F1320; --accent-soft:#232E55; --ok:#5ACB9B; --ok-soft:#173A2D; --warn:#E6AA5C; --warn-soft:#3E2F18;
  --off:#5C6482; --hatch:#222943; --danger:#F07A66; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hint{font-size:.88rem;color:var(--muted);margin:0}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px}
.month h2,.month h3{text-transform:capitalize;text-align:center}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font-size:1.3rem;display:grid;place-items:center}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.summary div{background:var(--sheet);padding:12px 14px;min-width:0}
.summary .v{font-family:var(--f-display);font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.summary .v.ok{color:var(--ok)} .summary .v.warn{color:var(--warn)}
@media (max-width:400px){.summary .v{font-size:1.1rem}}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row:hover{border-color:var(--accent)}
.row .name{font-weight:700;font-size:1.08rem;min-width:0;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:.9rem;min-width:0}
.row .amt{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;justify-self:end}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.ex{font-size:.72rem;font-weight:700;color:var(--muted);border:1px dashed var(--off);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

.btn{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 16px;font-weight:700;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.okb{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.wide{width:100%}
.empty{background:var(--sheet);border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.empty strong{color:var(--ink);display:block;margin-bottom:4px;font-size:1.05rem}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:12px 60px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{flex:1;min-width:0;overflow-wrap:anywhere}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1/1.05;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-variant-numeric:tabular-nums}
.day .d{font-weight:700;font-size:1rem}
.day .h{font-size:.68rem;font-weight:700;min-height:1em;white-space:nowrap}
.day.blank{visibility:hidden}
.day.habit{background:var(--accent-soft);border-color:transparent}
.day.habit .h{color:var(--accent)}
.day.extra{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.missed{color:var(--off)} .day.missed .d{text-decoration:line-through}
.day.holiday{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,var(--sheet) 5px 10px);color:var(--muted)}
.day.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 14px;font-weight:700;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.receipt{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:4px 4px 14px 14px;padding:26px 20px 18px;font-family:var(--f-mono);font-size:.9rem;line-height:1.55}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-1px;height:10px;background:radial-gradient(circle at 7px 0,var(--paper) 5px,transparent 5.5px) 0 0/14px 10px repeat-x}
.receipt .rh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.receipt .rh b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.06em}
.receipt .total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-weight:600;font-size:1.05rem}
.receipt .detail{color:var(--muted);overflow-wrap:anywhere}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:2px 10px;font-weight:600;transform:rotate(-4deg);margin-top:10px}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.dayrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.dayrow input[type=time]{max-width:150px}
.confirm{background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
textarea.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.85rem;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px}

/* horario semanal */
.week{display:flex;flex-direction:column;gap:10px}
.wday{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wday.today{border-color:var(--accent);border-width:2px}
.wday h3{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--accent-soft);font-size:1rem;text-transform:capitalize}
.wday.holi h3{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,var(--sheet) 5px 10px)}
.slot{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .t{font-family:var(--f-mono);font-weight:600;font-size:.9rem}
.slot .n{font-weight:700;min-width:0;overflow-wrap:anywhere}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.slot.none{color:var(--muted);grid-template-columns:1fr}
@media (min-width:860px){.wrap.wide-ok{max-width:1100px}.week{display:grid;grid-template-columns:repeat(6,1fr);align-items:start}.slot{grid-template-columns:1fr;gap:2px}}

@media (prefers-reduced-motion:no-preference){.row,.btn,.chip,.day{transition:border-color .15s,background .15s}}

/* impresión: solo los recibos */
#printArea{display:none}
@media print{
  @page{size:A5 portrait;margin:12mm}
  body{background:#fff;color:#000;padding:0}
  #app,#sheet,#toast{display:none!important}
  #printArea{display:block}
  .pr{page-break-after:always;break-after:page;font-family:var(--f-body);color:#000}
  .pr:last-child{page-break-after:auto;break-after:auto}
  .pr h1{font-family:var(--f-display);font-size:22pt;letter-spacing:.08em;margin:0}
  .pr .n{font-family:var(--f-mono);font-size:10pt}
  .pr .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid #000;padding-bottom:6pt;margin-bottom:12pt}
  .pr table{width:100%;border-collapse:collapse;font-size:11pt}
  .pr td{padding:4pt 0;vertical-align:top}
  .pr td:first-child{color:#444;width:32%}
  .pr .tot{display:flex;justify-content:space-between;border-top:1pt dashed #000;border-bottom:1pt dashed #000;margin-top:12pt;padding:8pt 0;font-size:15pt;font-weight:700}
  .pr .firma{margin-top:28pt;display:flex;justify-content:space-between;gap:20pt;font-size:10pt}
  .pr .firma div{flex:1;border-top:.75pt solid #000;padding-top:4pt}
  .pr .pagado{display:inline-block;border:2pt solid #000;padding:2pt 10pt;margin-top:10pt;font-weight:700;transform:rotate(-3deg)}
}
/* buscador, filtros y selección */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{position:relative}
.search input{width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 40px;min-height:48px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .spacer{flex:1}
.chip.small{min-height:38px;padding:6px 12px;font-size:.92rem}
.row{position:relative}
.selmode .row{grid-template-columns:auto 1fr auto}
.selmode .row .meta{grid-column:2}
.selmode .row .pill{grid-column:3}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--off);display:grid;place-items:center;grid-row:span 2;color:transparent;font-weight:800}
.row.on{border-color:var(--accent);background:var(--accent-soft)}
.row.on .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ink);color:var(--paper);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.selbar .count{font-weight:700;flex:1 1 100%}
.selbar .btn{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 40%,transparent);min-height:42px;padding:8px 14px}
.selbar .btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.noresults{padding:18px;text-align:center;color:var(--muted)}
.sync{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.off i{background:var(--warn)}

/* acceso */
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.err{color:var(--danger);font-weight:700;margin:0}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* vista del alumno */
.kid h1{font-size:2.1rem}
.kid .next{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.kid .next .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.kid .next .big::first-letter,.kitem .f::first-letter{text-transform:uppercase}
.klist{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.kitem:first-child{border-top:0}
.kitem .f{font-weight:700}
.kitem.past{color:var(--off)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:.75rem;font-weight:800;margin-left:4px;vertical-align:1px}
.reqs{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.req{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.req .who{font-weight:700;font-size:1.05rem}
.req .when::first-letter{text-transform:uppercase}
.req .when{font-weight:700}
.req .nota{background:var(--paper);border-radius:8px;padding:6px 10px;font-size:.92rem;overflow-wrap:anywhere}
.req .aviso{color:var(--warn);font-size:.88rem;font-weight:700}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--warn-soft);color:var(--ink);border:0;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.st{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.pendiente{background:var(--warn-soft);color:var(--warn)} .st.aceptada{background:var(--ok-soft);color:var(--ok)} .st.rechazada{background:var(--hatch);color:var(--muted)}
.kform{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.kform .grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media (max-width:420px){.kform .grid3{grid-template-columns:1fr 1fr}.kform .grid3 .field:first-child{grid-column:1/-1}}
/* ---- v3: navegación inferior, horario en cuadrícula, peticiones ---- */
body.con-nav{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:700;position:relative;min-width:0}
.bnav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.bnav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
.selbar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
header.top{align-items:center}
.sync{margin:0}

.mini{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;min-height:34px}
.mini.add{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mini.warn{color:var(--danger)}
.wday h3{align-items:center}
.dacts{display:flex;gap:6px;flex-wrap:wrap}
.slot.cancel .n{text-decoration:line-through;color:var(--off)}
.confirm label{font-weight:700}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.acard:hover{border-color:var(--accent)}
.acard .name{font-weight:700;overflow-wrap:anywhere}
.acard .dd{display:flex;gap:3px;flex-wrap:wrap}
.acard .dd span{font-size:.72rem;font-weight:800;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--hatch);color:var(--off)}
.acard .dd span.on{background:var(--accent-soft);color:var(--accent)}
.acard.baja{opacity:.6}

.req.falta{border-left-color:var(--danger)}
.req.prop{border-left-color:var(--accent)}
.req .tipo{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.req .ruta{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.95rem}
.req .ruta b{color:var(--muted);font-weight:700}
.hist{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist .kitem{font-size:.92rem}
.pick{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}

/* horario del alumno en cuadrícula */

.wk .wh{padding:8px 2px;text-align:center;font-size:.78rem;font-weight:800;border-bottom:1px solid var(--line);color:var(--muted);min-width:0}
.wk .wh b{display:block;font-size:1.05rem;color:var(--ink);font-family:var(--f-display)}
.wk .wh.hoy{background:var(--accent-soft)}
.wk .wh.hoy b{color:var(--accent)}
.wk .tcol{position:relative;border-right:1px solid var(--line)}
.wk .tcol span{position:absolute;right:4px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);transform:translateY(-50%)}

.blk{position:absolute;left:3px;right:3px;border-radius:8px;background:var(--accent);color:var(--on-accent);border:0;padding:3px 4px;font-family:var(--f-mono);font-size:.68rem;font-weight:600;line-height:1.2;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.blk small{font-family:var(--f-body);font-size:.62rem;font-weight:800;opacity:.9}
.blk.extra{background:var(--ok);color:#fff}
.blk.pend{background:var(--sheet);color:var(--accent);border:2px dashed var(--accent)}
.blk.prop{background:var(--warn-soft);color:var(--warn);border:2px solid var(--warn)}
.blk.off{background:var(--hatch);color:var(--off);text-decoration:line-through}

.kleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin-top:8px}

.aviso-k{background:var(--warn-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}

.kprop{background:var(--sheet);border:2px solid var(--warn);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}

.franja{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}

@media (min-width:860px){.franja{grid-template-columns:1fr}.franja .t{flex-direction:row;justify-content:space-between}}

const VAPID = "BLTkZkxXwWv_pdLAs6sNWq4UgrKq172LGlEttcuC9uwBrmVm6SB0Lp-s6mQ-BI5MjjeH4R2eYaItSbGaXE_uGNU";

<script>
(function(){
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_CORTO=["L","M","X","J","V","S","D"];
const DIAS_PL=["lunes","martes","miércoles","jueves","viernes","sábados","domingos"];
const DIAS_SG=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const DUR=[1,1.5,2,2.5,3];
const MOTIVOS=["Estoy enfermo/a","Tengo otro compromiso","Estoy fuera","Otro motivo"];
const ESTADO_K={pendiente:"Esperando respuesta",propuesta:"Te propone otra hora",confirmada:"Confirmada",aceptada:"Aceptada",rechazada:"No puede",cancelada:"Cancelada",aviso:"Avisado"};
const eur=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const hrs=n=>(Number.isInteger(n)?n:n.toLocaleString("es-ES"))+" h";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const isoOf=dt=>dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
const wdOf=dt=>(dt.getDay()+6)%7;
const keyOf=(y,m)=>y+"-"+pad(m+1);
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o||{},k);
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const clone=o=>JSON.parse(JSON.stringify(o));
const randId=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(b=>"abcdefghijkmnpqrstuvwxyz23456789"[b%32]).join("")};
const parseIso=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const toMin=t=>{const [H,M]=t.split(":").map(Number);return H*60+M};
function finHora(t,h){if(!t)return "";const mins=toMin(t)+Math.round(h*60);return pad(Math.floor(mins/60)%24)+":"+pad(mins%60)}
const rango=(t,h)=>t?t+"–"+finHora(t,h):hrs(h);
const fechaLarga=iso=>{const dt=parseIso(iso);return DIAS_SG[wdOf(dt)]+" "+dt.getDate()+" de "+MESES[dt.getMonth()]};
const hoyIso=()=>isoOf(new Date());
const ahora=()=>new Date().toISOString();
function lunes(dt){const d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());d.setDate(d.getDate()-wdOf(d));return d}
const cab=(t,act="close")=>`<div class="sheet-head"><button class="iconbtn" data-act="${act}" aria-label="Volver">←</button><h2>${t}</h2></div>`;
const durOpts=(sel)=>DUR.map(v=>`<option value="${v}" ${v===sel?"selected":""}>${hrs(v)}</option>`).join("");
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

/* ---------- Firebase ---------- */
if(!firebaseConfig.apiKey||firebaseConfig.apiKey==="PEGA_AQUI"){$("app").innerHTML=`<div class="login"><h1>Falta configurar</h1></div>`;return}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const fs=firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});

/* ---------- avisos push ---------- */
const esIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const instalada=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
async function pushSoportado(){try{return !!(window.Notification&&navigator.serviceWorker&&firebase.messaging&&await firebase.messaging.isSupported())}catch(e){return false}}
let pushEscucha=false;
async function obtenerToken(pedir){
  if(!VAPID||VAPID.startsWith("VAPID"))throw new Error("sinclave");
  if(!(await pushSoportado()))throw new Error("nosoporte");
  if(pedir){const p=await Notification.requestPermission();if(p!=="granted")throw new Error("denegado")}
  else if(Notification.permission!=="granted")return null;
  const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
  const m=firebase.messaging();
  const tok=await m.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!pushEscucha){pushEscucha=true;m.onMessage(p=>{const n=p.notification||{};toast((n.title?n.title+": ":"")+(n.body||""))})}
  return tok;
}
function errorPush(e){const c=e&&e.message;
  if(c==="denegado")return "Los avisos están bloqueados. Permítelos para esta web en los ajustes del navegador y vuelve a pulsar.";
  if(c==="nosoporte")return esIOS&&!instalada?"En iPhone, primero añade esta página a la pantalla de inicio (Compartir › Añadir a pantalla de inicio) y ábrela desde ese icono.":"Este navegador no admite avisos. Prueba con Chrome.";
  if(c==="sinclave")return "Los avisos aún no están configurados.";
  return "No se pudieron activar los avisos. Prueba otra vez."}
const pushHint=()=>esIOS&&!instalada?`<p class="hint">En iPhone solo funcionan si abres la app desde el icono de la pantalla de inicio (Safari › Compartir › Añadir a pantalla de inicio).</p>`:"";

/* ---------- vista pública del alumno ---------- */
const params=new URLSearchParams(location.search);
if(params.get("h")){vistaAlumno(params.get("h"));return}

/* ---------- estado ---------- */
let D={alumnos:{},config:{profesora:"",ultimaCopia:""},meses:{},solicitudes:{}};
let uid=null,ref=null;
const hoy=new Date();
const leerVista=()=>{try{return localStorage.getItem("vista-alumnos")||"lista"}catch(e){return "lista"}};
const S={tab:"recibos",y:hoy.getFullYear(),m:hoy.getMonth(),wk:lunes(hoy),sheet:null,selDate:null,editing:null,confirmDel:false,confirmDia:null,
  q:"",filtro:"todos",sel:new Set(),selMode:false,qa:"",vista:leerVista(),histOpen:false,pushOn:false,
  cargado:{alumnos:false,meses:false,config:false},online:navigator.onLine};
const openId=()=>S.sheet&&S.sheet.k==="alumno"?S.sheet.id:null;
function mes(y,m){const k=keyOf(y,m);const x=D.meses[k]||(D.meses[k]={});x.dias=x.dias||{};x.horaExtra=x.horaExtra||{};x.festivos=x.festivos||[];x.pagado=x.pagado||{};x.motivos=x.motivos||{};return x}
const mesIso=iso=>{const d=parseIso(iso);return mes(d.getFullYear(),d.getMonth())};
const keyIso=iso=>iso.slice(0,7);
window.addEventListener("online",()=>{S.online=true;renderSync()});
window.addEventListener("offline",()=>{S.online=false;renderSync()});

/* ---------- acceso ---------- */
let unsubs=[];
auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){uid=null;pantallaLogin();return}
  uid=u.uid;ref=fs.collection("users").doc(uid);
  D={alumnos:{},config:{profesora:"",ultimaCopia:""},meses:{},solicitudes:{}};S.cargado={alumnos:false,meses:false,config:false};
  $("app").innerHTML=`<div class="loading">Cargando tus alumnos…</div>`;
  unsubs.push(ref.collection("alumnos").onSnapshot(s=>{const a={};s.forEach(d=>a[d.id]=d.data());D.alumnos=a;S.cargado.alumnos=true;remoto()},e=>errorDatos(e)));
  unsubs.push(ref.collection("meses").onSnapshot(s=>{const m={};s.forEach(d=>m[d.id]=d.data());D.meses=Object.assign(m,pendientesMes());S.cargado.meses=true;remoto()},e=>errorDatos(e)));
  unsubs.push(ref.collection("config").doc("general").onSnapshot(d=>{if(d.exists)D.config=Object.assign({profesora:"",ultimaCopia:""},d.data());S.cargado.config=true;remoto()},()=>{S.cargado.config=true;remoto()}));
  unsubs.push(fs.collection("solicitudes").where("owner","==",uid).onSnapshot(s=>{
    const o={};s.forEach(d=>o[d.id]=Object.assign({id:d.id,tipo:"extra"},d.data()));const prev=D.solicitudes;D.solicitudes=o;
    const ch=new Set();for(const id in o)if(!prev[id]||prev[id].estado!==o[id].estado||prev[id].f!==o[id].f||prev[id].t!==o[id].t)ch.add(o[id].alumnoId);
    if(S.cargado.alumnos){const l=[...ch].filter(x=>D.alumnos[x]);if(l.length)publicarHorarios(l);limpiarSolicitudes()}
    remoto()},e=>console.error(e)));
  obtenerToken(false).then(t=>{if(t){S.pushOn=true;guardarTokenProfe(t)}}).catch(()=>{});
});
function guardarTokenProfe(t){return ref.collection("push").doc(t).set({creado:ahora(),dispositivo:navigator.userAgent.slice(0,140)})}
function errorDatos(e){console.error(e);$("nav").hidden=true;$("app").innerHTML=`<div class="login"><h1>No se pueden leer los datos</h1><p class="hint">Revisa que las reglas de Firestore estén publicadas.</p><button class="btn" data-act="salir">Salir</button></div>`}
function pantallaLogin(){
  $("sheet").hidden=true;$("selbar").hidden=true;$("nav").hidden=true;document.body.classList.remove("con-nav");
  $("app").innerHTML=`<form class="login" id="fLogin" method="post" action="#"><div><div class="label">Clases particulares</div><h1>Recibos</h1></div>
    <div class="field"><label class="label" for="lEmail">Correo</label><input id="lEmail" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label class="label" for="lPass">Contraseña</label><input id="lPass" name="password" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lErr" hidden></p>
    <button class="btn primary" type="submit">Entrar</button>
    <button class="btn ghost" type="button" data-act="olvido">He olvidado la contraseña</button></form>`;
}

/* ---------- guardado ---------- */
const pend={};
function pendientesMes(){const o={};for(const k in pend)o[k]=D.meses[k];return o}
function fallo(e){console.error(e);toast("No se pudo guardar. Se intentará de nuevo con conexión.")}
function saveAlumno(a){D.alumnos[a.id]=a;ref.collection("alumnos").doc(a.id).set(a).catch(fallo);publicarHorarios([a.id])}
function deleteAlumno(id){const a=D.alumnos[id];delete D.alumnos[id];ref.collection("alumnos").doc(id).delete().catch(fallo);if(a&&a.token)fs.collection("horarios").doc(a.token).delete().catch(()=>{})}
function saveMes(k,ids){mesIso(k+"-01");pend[k]=(pend[k]||0)+1;ref.collection("meses").doc(k).set(clone(D.meses[k])).catch(fallo).finally(()=>{if(--pend[k]<=0)delete pend[k]});if(ids)publicarHorarios(ids)}
let cfgT;function saveConfig(){clearTimeout(cfgT);cfgT=setTimeout(()=>ref.collection("config").doc("general").set(clone(D.config)).catch(fallo),600)}

/* horario público de cada alumno: horarios/{código} */
let pubIds=new Set(),pubT;
function publicarHorarios(ids){(ids==="todos"?Object.keys(D.alumnos):ids).forEach(i=>pubIds.add(i));clearTimeout(pubT);pubT=setTimeout(()=>{const l=[...pubIds];pubIds.clear();l.forEach(publicarUno)},1200)}
function publicarUno(id){
  const a=D.alumnos[id];if(!a||!a.token)return;
  const r=fs.collection("horarios").doc(a.token);
  if(a.activo===false){r.delete().catch(()=>{});return}
  const h=new Date();const clases=[];
  for(let k=0;k<2;k++){const y=h.getFullYear()+Math.floor((h.getMonth()+k)/12),m=(h.getMonth()+k)%12;const c=calc(a,y,m);
    for(const x of diasDelMes(y,m)){const p=c.porDia[x.iso];if(p.h>0)clases.push({f:x.iso,t:p.t||"",fin:p.t?finHora(p.t,p.h):"",h:p.h,extra:p.tipo==="extra"})}}
  const lim=isoOf(new Date(Date.now()-45*864e5));
  const pets=Object.values(D.solicitudes).filter(x=>x.alumnoId===id&&x.creada>=lim).sort((x,y)=>y.creada.localeCompare(x.creada)).slice(0,15)
    .map(x=>{const o={id:x.id,tipo:x.tipo||"extra",f:x.f,t:x.t||"",h:x.h,estado:x.estado,aplicada:!!x.aplicada,actualizada:x.actualizada||x.creada||""};if(x.de)o.de=x.de;if(x.motivo)o.motivo=x.motivo;if(x.notaProfe)o.notaProfe=x.notaProfe;return o});
  r.set({owner:uid,alumnoId:id,solicitudes:pets,avisos:(a.avisos||[]).slice(0,10),nombre:a.nombre,normal:horarioTxt(a),horas:a.horas||1,profesora:D.config.profesora||"",clases,actualizado:ahora()}).catch(e=>console.error(e));
}

/* ---------- avisos a los alumnos ---------- */
const cola={};let colaT;
function encolarAviso(aid,texto){if(!D.alumnos[aid])return;(cola[aid]=cola[aid]||[]).push(texto);clearTimeout(colaT);colaT=setTimeout(vaciarCola,2500)}
function vaciarCola(){for(const aid of Object.keys(cola)){const t=cola[aid];delete cola[aid];enviarAviso([aid],"Cambio en tus clases",t.join(" · "))}}
function enviarAviso(aids,titulo,cuerpo){
  const al=[...new Set(aids)].map(i=>D.alumnos[i]).filter(a=>a&&a.token&&a.activo!==false);if(!al.length)return;
  const fecha=ahora();
  al.forEach(a=>{a.avisos=[{fecha,texto:cuerpo.slice(0,280)}].concat(a.avisos||[]).slice(0,10);ref.collection("alumnos").doc(a.id).update({avisos:a.avisos}).catch(()=>{})});
  publicarHorarios(al.map(a=>a.id));
  for(let i=0;i<al.length;i+=50)fs.collection("avisos").add({para:"alumnos",owner:uid,alumnos:al.slice(i,i+50).map(a=>a.token),titulo:titulo.slice(0,90),cuerpo:cuerpo.slice(0,280),creado:fecha}).catch(e=>console.error(e));
}

/* ---------- cálculo ---------- */
function diasDelMes(y,m){const n=new Date(y,m+1,0).getDate();const out=[];for(let d=1;d<=n;d++){const dt=new Date(y,m,d);out.push({d,iso:isoOf(dt),wd:wdOf(dt)})}return out}
function infoDia(a,iso,wd,mm){
  const ov=mm.dias[a.id]||{};const fest=mm.festivos.includes(iso);const habitual=(a.dias||[]).includes(wd);let h,tipo;
  if(has(ov,iso)){h=ov[iso];tipo=h===0?(habitual&&!fest?"missed":(fest?"holiday":"none")):(habitual&&!fest?"habit":"extra")}
  else if(fest){h=0;tipo="holiday"}else if(habitual){h=a.horas||1;tipo="habit"}else{h=0;tipo="none"}
  const t=((mm.horaExtra[a.id]||{})[iso])||((a.hora||{})[wd])||"";
  const motivo=((mm.motivos||{})[a.id]||{})[iso]||"";
  return {h,tipo,habitual,fest,t,motivo,override:has(ov,iso)};
}
const infoIso=(a,iso)=>infoDia(a,iso,wdOf(parseIso(iso)),mesIso(iso));
function setClase(aid,iso,h,t){
  const a=D.alumnos[aid];const mm=mesIso(iso);const wd=wdOf(parseIso(iso));
  const normal=(a.dias||[]).includes(wd)&&!mm.festivos.includes(iso)?(a.horas||1):0;
  const ov={...(mm.dias[aid]||{})};if(h===normal)delete ov[iso];else ov[iso]=h;mm.dias[aid]=ov;
  mm.horaExtra[aid]=mm.horaExtra[aid]||{};if(h>0&&t&&t!==(a.hora||{})[wd])mm.horaExtra[aid][iso]=t;else delete mm.horaExtra[aid][iso];
  if(h>0&&mm.motivos[aid])delete mm.motivos[aid][iso];
  return keyIso(iso);
}
function setMotivo(aid,iso,txt){const mm=mesIso(iso);mm.motivos[aid]=mm.motivos[aid]||{};if(txt)mm.motivos[aid][iso]=txt.slice(0,120);else delete mm.motivos[aid][iso]}
function calc(a,y=S.y,m=S.m){
  const mm=mes(y,m);let horas=0,clases=0;const lineas=[];const porDia={};
  for(const x of diasDelMes(y,m)){const p=infoDia(a,x.iso,x.wd,mm);porDia[x.iso]=p;
    if(p.h>0){horas+=p.h;clases++;lineas.push(x.d+(p.h!==(a.horas||1)?" ("+hrs(p.h)+")":"")+(p.tipo==="extra"?"*":""))}}
  return {horas,clases,importe:Math.round(horas*(a.precio||0)*100)/100,lineas,porDia};
}
const activos=()=>Object.values(D.alumnos).filter(a=>a.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
function numRecibo(a){const i=activos().findIndex(x=>x.id===a.id)+1;return S.y+"/"+pad(S.m+1)+"-"+pad(i||0)}
function horarioTxt(a){const d=(a.dias||[]).slice().sort();if(!d.length)return "Sin días fijos";
  return d.map(i=>DIAS_PL[i]+((a.hora||{})[i]?" "+a.hora[i]:"")).join(", ").replace(/, ([^,]*)$/," y $1")}
function fmtFecha(iso){const [y,m,d]=iso.split("-").map(Number);return d+" de "+MESES[m-1]+" de "+y}
function ultimoDia(){return new Date(S.y,S.m+1,0).getDate()+" de "+MESES[S.m]+" de "+S.y}
function textoRecibo(a){
  const c=calc(a);const mm=mes(S.y,S.m);
  const t=["RECIBO Nº "+numRecibo(a),"","Alumno/a: "+a.nombre,"Mes: "+MESES[S.m]+" de "+S.y,"Clases: "+c.clases+" días, "+hrs(c.horas)+" × "+eur(a.precio||0)+"/h","Días: "+(c.lineas.join(", ")||"—")];
  if(c.lineas.some(l=>l.endsWith("*")))t.push("(* día extra)");
  t.push("","TOTAL: "+eur(c.importe));if(mm.pagado[a.id])t.push("PAGADO el "+fmtFecha(mm.pagado[a.id]));
  t.push("",(D.config.profesora?D.config.profesora+" · ":"")+ultimoDia());return t.join("\n");
}

/* ---------- peticiones ---------- */
const porResponder=()=>Object.values(D.solicitudes).filter(x=>x.estado==="pendiente").sort((a,b)=>(a.f+a.t).localeCompare(b.f+b.t));
const faltasNuevas=()=>Object.values(D.solicitudes).filter(x=>x.tipo==="falta"&&x.estado==="aviso"&&!x.visto).sort((a,b)=>a.f.localeCompare(b.f));
const esperando=()=>Object.values(D.solicitudes).filter(x=>x.estado==="propuesta"||(x.estado==="confirmada"&&!x.aplicada));
const nPet=()=>porResponder().length+faltasNuevas().length;
let limpiado=false;
function limpiarSolicitudes(){if(limpiado)return;limpiado=true;const lim=new Date(Date.now()-60*864e5).toISOString();
  Object.values(D.solicitudes).forEach(x=>{if(["aceptada","rechazada","cancelada"].includes(x.estado)||(x.tipo==="falta"&&x.visto)){if((x.actualizada||x.creada)<lim)fs.collection("solicitudes").doc(x.id).delete().catch(()=>{})}})}
function descr(x){
  if(x.tipo==="falta")return "no ir el "+fechaLarga(x.f)+(x.motivo?" ("+x.motivo+")":"");
  if(x.tipo==="cambio"&&x.de)return "cambiar la clase del "+fechaLarga(x.de.f)+" al "+fechaLarga(x.f)+" "+rango(x.t,x.h);
  return "clase extra el "+fechaLarga(x.f)+" "+rango(x.t,x.h);
}
function aplicarSolicitud(x){
  const a=D.alumnos[x.alumnoId];if(!a)return;const keys=new Set();
  if(x.tipo==="falta"){keys.add(setClase(a.id,x.f,0));setMotivo(a.id,x.f,x.motivo||"Avisó que no viene")}
  else{if(x.tipo==="cambio"&&x.de&&x.de.f!==x.f)keys.add(setClase(a.id,x.de.f,0));keys.add(setClase(a.id,x.f,x.h,x.t))}
  keys.forEach(k=>saveMes(k));publicarHorarios([a.id]);
}
const enCurso=new Set();
function procesarAuto(){
  if(!S.cargado.alumnos||!S.cargado.meses)return;
  for(const x of Object.values(D.solicitudes)){
    if(x.aplicada||enCurso.has(x.id))continue;
    const conf=x.estado==="confirmada",falta=x.tipo==="falta"&&x.estado==="aviso";
    if(!conf&&!falta)continue;
    if(!D.alumnos[x.alumnoId])continue;
    enCurso.add(x.id);aplicarSolicitud(x);x.aplicada=true;
    const upd={aplicada:true,actualizada:ahora()};if(conf){upd.estado="aceptada";x.estado="aceptada"}
    fs.collection("solicitudes").doc(x.id).update(upd).catch(fallo);
  }
}
function choques(sol){
  const dt=parseIso(sol.f);const mm=mesIso(sol.f);const wd=wdOf(dt);
  const ini=sol.t?toMin(sol.t):null,fin=ini!=null?ini+sol.h*60:null;const out=[];
  for(const a of activos()){const p=infoDia(a,sol.f,wd,mm);if(p.h<=0)continue;
    if(a.id===sol.alumnoId){if(!(sol.tipo==="cambio"&&sol.de&&sol.de.f===sol.f))out.push("Ese día ya tiene clase"+(p.t?" a las "+p.t:""));continue}
    if(ini==null||!p.t)continue;const i2=toMin(p.t),f2=i2+p.h*60;if(ini<f2&&i2<fin)out.push("Coincide con "+a.nombre+" ("+rango(p.t,p.h)+")")}
  if(mm.festivos.includes(sol.f))out.push("Ese día está cancelado");
  return out;
}
function responder(id,ok){
  const x=D.solicitudes[id];if(!x)return;
  if(ok){aplicarSolicitud(x);x.aplicada=true;x.estado="aceptada"}else x.estado="rechazada";
  x.por="profesora";x.actualizada=ahora();
  fs.collection("solicitudes").doc(id).update({estado:x.estado,aplicada:!!ok,por:"profesora",actualizada:x.actualizada}).catch(fallo);
  enviarAviso([x.alumnoId],ok?"Petición aceptada":"Petición rechazada",(ok?"Aceptada: ":"Tu profesora no puede: ")+descr(x)+".");
  publicarHorarios([x.alumnoId]);render();toast(ok?"Aceptada y añadida al horario":"Petición rechazada");
}

function viewHorario(){
  const dias=[...Array(7)].map((_,i)=>{const d=new Date(S.wk);d.setDate(d.getDate()+i);return d});
  const fin=dias[6];const hoyI=hoyIso();
  const tit=dias[0].getDate()+(dias[0].getMonth()!==fin.getMonth()?" "+MESES[dias[0].getMonth()].slice(0,3):"")+" – "+fin.getDate()+" "+MESES[fin.getMonth()];
  const al=activos();
  const bloques=dias.map((d,i)=>{const iso=isoOf(d);const mm=mes(d.getFullYear(),d.getMonth());
    const items=al.map(a=>({a,p:infoDia(a,iso,i,mm)})).filter(x=>x.p.h>0).sort((x,y)=>(x.p.t||"99").localeCompare(y.p.t||"99"));
    const fest=mm.festivos.includes(iso);
    if(i>=5&&!items.length&&!fest)return "";
    const quitadas=al.map(a=>({a,p:infoDia(a,iso,i,mm)})).filter(x=>x.p.tipo==="missed"&&x.p.motivo);
    const grupos=[];for(const it of items){const k=rango(it.p.t,it.p.h);const g=grupos.find(x=>x.k===k);g?g.l.push(it):grupos.push({k,l:[it]})}

      +quitadas.map(({a,p})=>`<div class="slot cancel"><span class="t">—</span><span class="n">${esc(a.nombre)}</span><span class="hint">${esc(p.motivo)}</span></div>`).join("");

        <span class="hint">Se avisará a ${items.length} ${items.length===1?"alumno":"alumnos"}.</span>

    return `<section class="wday${iso===hoyI?" today":""}${fest?" holi":""}"><h3><span>${DIAS_SG[i]} ${d.getDate()}</span>
        <span class="dacts">${fest?`<button class="mini" data-recup="${iso}">Recuperar día</button>`:`<button class="mini add" data-add="${iso}" aria-label="Añadir clase el ${fechaLarga(iso)}">+ Clase</button><button class="mini warn" data-canc="${iso}">Cancelar día</button>`}</span></h3>
        ${conf}${slots||`<div class="slot none">${fest?"Día cancelado":"Sin clases"}</div>`}</section>`}).join("");
  return `<div class="month"><button class="iconbtn" data-act="wprev" aria-label="Semana anterior">‹</button><h2 class="num" style="text-transform:none">${tit}</h2><button class="iconbtn" data-act="wnext" aria-label="Semana siguiente">›</button></div>

}
function cardSol(x,modo){
  const a=D.alumnos[x.alumnoId];const nombre=esc(a?a.nombre:x.nombre);
  const tipoTxt=x.tipo==="falta"?"No puede venir":x.tipo==="cambio"?"Cambio de clase":"Clase extra";
  let ruta;
  if(x.tipo==="cambio"&&x.de)ruta=`<div class="ruta"><b>De</b><span>${fechaLarga(x.de.f)} · ${rango(x.de.t,x.de.h)}</span><b>A</b><span>${fechaLarga(x.f)} · ${rango(x.t,x.h)}</span></div>`;
  else if(x.tipo==="falta")ruta=`<span class="when">${fechaLarga(x.f)}${x.t?" · "+rango(x.t,x.h):""}</span>`;
  else ruta=`<span class="when">${fechaLarga(x.f)} · ${rango(x.t,x.h)}</span>`;
  const av=modo==="responder"?(a?choques(x):["Este alumno ya no está en la lista"]):[];
  let btns="";
  if(modo==="responder")btns=`<div class="btns"><button class="btn okb" data-acept="${x.id}" ${a?"":"disabled"}>Aceptar</button><button class="btn" data-prop="${x.id}" ${a?"":"disabled"}>Otra hora</button><button class="btn ghost" data-rech="${x.id}">Rechazar</button></div>`;
  if(modo==="falta")btns=`<div class="btns"><button class="btn" data-visto="${x.id}">Entendido</button></div>`;
  if(modo==="espera")btns=`<span class="hint">${x.estado==="confirmada"?"El alumno ha aceptado. Se aplica ahora.":"Esperando a que "+nombre+" acepte o proponga otra."}</span>`;
  return `<div class="req${x.tipo==="falta"?" falta":""}${modo==="espera"?" prop":""}"><span class="tipo">${tipoTxt}</span><span class="who">${nombre}</span>${ruta}
    ${x.motivo?`<span class="nota">${esc(x.motivo)}</span>`:""}${x.nota?`<span class="nota">«${esc(x.nota)}»</span>`:""}${x.notaProfe&&modo==="espera"?`<span class="nota">Tu nota: ${esc(x.notaProfe)}</span>`:""}
    ${av.map(t=>`<span class="aviso">${esc(t)}</span>`).join("")}${btns}</div>`;
}

function calendario(porDia,{festivos=false}={}){
  const dias=diasDelMes(S.y,S.m);const fest=new Set(mes(S.y,S.m).festivos);
  let h=DIAS_CORTO.map(d=>`<div class="wd">${d}</div>`).join("");
  for(let i=0;i<dias[0].wd;i++)h+=`<div class="day blank"></div>`;
  for(const x of dias){let cls="day",lab="";
    if(festivos){if(fest.has(x.iso)){cls+=" holiday";lab="festivo"}}
    else{const p=porDia[x.iso];
      if(p.tipo==="habit"){cls+=" habit";lab=hrs(p.h)}else if(p.tipo==="extra"){cls+=" extra";lab="+"+hrs(p.h)}
      else if(p.tipo==="missed"){cls+=" missed";lab="falta"}else if(p.tipo==="holiday"){cls+=" holiday";lab="festivo"}
      if(S.selDate===x.iso)cls+=" sel";}
    h+=`<button class="${cls}" data-day="${x.iso}" aria-label="${x.d} de ${MESES[S.m]}"><span class="d">${x.d}</span><span class="h">${lab}</span></button>`}
  return `<div class="cal">${h}</div>`;
}

}

function pdf(lista,nombre){
  if(!window.jspdf){toast("Para el PDF hace falta internet. Prueba «Imprimir» › Guardar como PDF");return}
  const doc=new window.jspdf.jsPDF({format:"a5",unit:"mm"});const W=148,M=14;
  lista.forEach((a,i)=>{if(i)doc.addPage();const c=calc(a);const pag=mes(S.y,S.m).pagado[a.id];let y=20;
    doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("RECIBO",M,y);
    doc.setFont("courier","normal");doc.setFontSize(10);doc.text("Nº "+numRecibo(a),W-M,y,{align:"right"});
    y+=4;doc.setLineWidth(.5);doc.line(M,y,W-M,y);y+=9;
    const fila=(k,v)=>{doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);doc.text(k,M,y);doc.setTextColor(0);doc.setFontSize(11);
      const ls=doc.splitTextToSize(v,W-M-48);doc.text(ls,M+38,y);y+=ls.length*5.2+2.5};
    fila("Alumno/a",a.nombre);fila("Concepto","Clases particulares de "+MESES[S.m]+" de "+S.y);
    fila("Clases",c.clases+" días · "+hrs(c.horas)+" × "+eur(a.precio||0)+"/h");
    fila("Días",(c.lineas.join(", ")||"—")+(c.lineas.some(l=>l.endsWith("*"))?"  (* día extra)":""));
    y+=2;doc.setLineDashPattern([1,1],0);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=8;
    doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("TOTAL",M,y);doc.text(eur(c.importe),W-M,y,{align:"right"});
    y+=4;doc.line(M,y,W-M,y);doc.setLineDashPattern([],0);y+=10;
    if(pag){doc.setFontSize(11);doc.setLineWidth(.6);doc.rect(M,y-5.5,62,8);doc.text("PAGADO · "+fmtFecha(pag),M+3,y);y+=10}
    y=Math.max(y+14,150);doc.setLineWidth(.3);doc.line(M,y,M+52,y);doc.line(W-M-52,y,W-M,y);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(D.config.profesora||"Firma",M,y+5);doc.text(ultimoDia(),W-M,y+5,{align:"right"});
  });
  doc.save(nombre);toast("PDF descargado");
}

async function importar(x){
  const b=fs.batch();let n=0;
  for(const a of Object.values(x.alumnos||{})){if(a.ejemplo)continue;const al=Object.assign({},a,{token:a.token||randId(16)});delete al.ejemplo;D.alumnos[al.id]=al;b.set(ref.collection("alumnos").doc(al.id),al);n++}
  for(const [k,v] of Object.entries(x.meses||{})){const m=clone(v);D.meses[k]=m;b.set(ref.collection("meses").doc(k),m)}
  if(x.config&&x.config.profesora){D.config.profesora=x.config.profesora;b.set(ref.collection("config").doc("general"),clone(D.config))}
  await b.commit();publicarHorarios("todos");render();toast(n+" alumnos traídos a la nube");
}

    const afect=activos().filter(a=>infoIso(a,iso).h>0).map(a=>a.id);if(futuro(iso))enviarAviso(afect,"Clase recuperada","Al final sí hay clase el "+fechaLarga(iso)+".");

  if(ds.open){if(ds.month){const d=parseIso(ds.month);S.y=d.getFullYear();S.m=d.getMonth();S.selDate=ds.month}else S.selDate=null;
    S.editing=null;S.sheet={k:"alumno",id:ds.open};render();$("sheet").scrollTop=0;return}
  if(ds.edit){S.editing=clone(D.alumnos[ds.edit]);S.sheet=null;S.confirmDel=false;render();$("sheet").scrollTop=0;return}
  if(ds.wd!==undefined){leerForm();const i=Number(ds.wd);const d=S.editing.dias||[];S.editing.dias=d.includes(i)?d.filter(x=>x!==i):[...d,i];renderSheet();return}
  if(ds.day){
    if(S.sheet&&S.sheet.k==="festivos"){const mm=mes(S.y,S.m);const f=new Set(mm.festivos);f.has(ds.day)?f.delete(ds.day):f.add(ds.day);mm.festivos=[...f].sort();saveMes(keyOf(S.y,S.m),"todos");render();return}
    S.selDate=S.selDate===ds.day?null:ds.day;render();return}
  if(ds.set!==undefined){const id=openId(),a=D.alumnos[id],mm=mes(S.y,S.m),iso=S.selDate;const ov={...(mm.dias[id]||{})};
    if(ds.set==="reset"){delete ov[iso];if(mm.horaExtra[id])delete mm.horaExtra[id][iso];setMotivo(id,iso,"");mm.dias[id]=ov}
    else setClase(id,iso,Number(ds.set),infoIso(a,iso).t);
    saveMes(keyOf(S.y,S.m),[id]);
    if(futuro(iso)){const p=infoIso(a,iso);encolarAviso(id,fechaLarga(iso)+": "+(p.h>0?rango(p.t,p.h):"sin clase"))}
    render();return}
  const act=ds.act;
  switch(act){
    case "prev":cambiarMes(-1);break;
    case "next":cambiarMes(1);break;
    case "wprev":S.wk.setDate(S.wk.getDate()-7);render();break;
    case "wnext":S.wk.setDate(S.wk.getDate()+7);render();break;
    case "whoy":S.wk=lunes(new Date());render();break;
    case "nuevo":nuevoAlumno();break;
    case "festivos":S.sheet={k:"festivos"};render();break;
    case "close":cerrar();break;
    case "cancel":S.editing=null;render();break;
    case "hist":S.histOpen=!S.histOpen;render();break;
    case "cdNo":S.confirmDia=null;render();break;
    case "cdSi":{const iso=S.confirmDia;const motivo=($("cdMotivo")||{}).value?.trim()||"";const mm=mesIso(iso);
      const afect=activos().filter(a=>infoIso(a,iso).h>0).map(a=>a.id);
      mm.festivos=[...new Set([...mm.festivos,iso])].sort();afect.forEach(aid=>{setClase(aid,iso,0);if(motivo)setMotivo(aid,iso,motivo)});
      saveMes(keyIso(iso),"todos");
      if(futuro(iso))enviarAviso(afect,"Clase cancelada","Tu clase del "+fechaLarga(iso)+" se cancela"+(motivo?": "+motivo:"")+".");
      S.confirmDia=null;render();toast(afect.length?"Día cancelado. Avisados "+afect.length+" alumnos.":"Día cancelado");break}
    case "anOtro":S.sheet.aid=null;S.sheet.t=null;S.sheet.h=null;renderSheet();break;
    case "anadirClase":{const {iso,aid}=S.sheet;const tt=$("anT").value,hh=Number($("anH").value);if(!tt){toast("Pon la hora");break}
      saveMes(setClase(aid,iso,hh,tt),[aid]);if(futuro(iso))encolarAviso(aid,"Nueva clase el "+fechaLarga(iso)+" "+rango(tt,hh));
      cerrar();toast("Clase añadida");break}
    case "moverClase":{const {aid,iso}=S.sheet;const f=$("cmF").value,tt=$("cmT").value,hh=Number($("cmH").value);if(!f||!tt){toast("Pon el día y la hora");break}
      const keys=new Set();if(f!==iso)keys.add(setClase(aid,iso,0));keys.add(setClase(aid,f,hh,tt));keys.forEach(k=>saveMes(k,[aid]));
      if(futuro(iso)||futuro(f))encolarAviso(aid,"Tu clase del "+fechaLarga(iso)+" pasa al "+fechaLarga(f)+" "+rango(tt,hh));
      cerrar();toast("Clase movida");break}
    case "quitarClase":{const {aid,iso}=S.sheet;const m=$("cmM").value.trim();saveMes(setClase(aid,iso,0),[aid]);setMotivo(aid,iso,m||"Quitada por la profesora");saveMes(keyIso(iso));
      if(futuro(iso))encolarAviso(aid,"Se quita tu clase del "+fechaLarga(iso)+(m?" ("+m+")":""));cerrar();toast("Clase quitada");break}
    case "enviarProp":{const x=D.solicitudes[S.sheet.sid];const f=$("pF").value,tt=$("pT").value,hh=Number($("pH").value),n=$("pN").value.trim();
      if(!f||!tt){toast("Pon el día y la hora");break}
      Object.assign(x,{estado:"propuesta",f,t:tt,h:hh,notaProfe:n,por:"profesora",actualizada:ahora()});
      fs.collection("solicitudes").doc(x.id).update({estado:"propuesta",f,t:tt,h:hh,notaProfe:n,por:"profesora",actualizada:x.actualizada}).catch(fallo);
      enviarAviso([x.alumnoId],"Tu profesora te propone otra hora","Te propone el "+fechaLarga(f)+" "+rango(tt,hh)+(n?" («"+n+"»)":"")+". Entra para aceptarla o proponer otra.");
      cerrar();toast("Propuesta enviada");break}
    case "pushOn":{t.disabled=true;try{const tok=await obtenerToken(true);await guardarTokenProfe(tok);S.pushOn=true;toast("Avisos activados en este dispositivo")}catch(err){console.error(err);toast(errorPush(err))}render();break}
    case "borrar":leerForm();S.confirmDel=true;renderSheet();break;
    case "borrarNo":leerForm();S.confirmDel=false;renderSheet();break;
    case "borrarSi":{const id=S.editing.id;S.editing=null;S.confirmDel=false;deleteAlumno(id);render();toast("Alumno borrado");break}
    case "pagar":{const id=openId(),mm=mes(S.y,S.m);if(mm.pagado[id])delete mm.pagado[id];else mm.pagado[id]=isoOf(new Date());saveMes(keyOf(S.y,S.m));render();toast(mm.pagado[id]?"Marcado como pagado":"Quitado «pagado»");break}
    case "copiar":copiar(textoRecibo(D.alumnos[openId()]),"Recibo copiado. Pégalo en WhatsApp.");break;
    case "copiarEnlace":{const a=D.alumnos[openId()];if(!a.token){a.token=randId(16);saveAlumno(a)}copiar("Hola, aquí puedes ver tus clases: "+enlaceHorario(a),"Enlace copiado. Pégalo en WhatsApp.");break}
    case "nuevoEnlace":{const a=D.alumnos[openId()];if(a.token)fs.collection("horarios").doc(a.token).delete().catch(()=>{});a.token=randId(16);saveAlumno(a);render();toast("Enlace nuevo creado. El anterior ya no funciona.");break}
    case "print":imprimir([D.alumnos[openId()]]);break;
    case "pdf":{const a=D.alumnos[openId()];pdf([a],"Recibo-"+nombreArchivo(a.nombre)+"-"+MESES[S.m]+"-"+S.y+".pdf");break}
    case "selIni":S.selMode=true;S.sel.clear();render();break;
    case "selTodos":listaFiltrada().forEach(a=>S.sel.add(a.id));renderLista();break;
    case "selFin":S.selMode=false;S.sel.clear();render();break;
    case "selPrint":imprimir(seleccionados());break;
    case "selPdf":{const l=seleccionados();pdf(l,l.length===1?"Recibo-"+nombreArchivo(l[0].nombre)+"-"+MESES[S.m]+"-"+S.y+".pdf":"Recibos-"+MESES[S.m]+"-"+S.y+".pdf");break}
    case "selPagar":{const mm=mes(S.y,S.m);const d=isoOf(new Date());let n=0;seleccionados().forEach(a=>{if(!mm.pagado[a.id]){mm.pagado[a.id]=d;n++}});saveMes(keyOf(S.y,S.m));S.selMode=false;S.sel.clear();render();toast(n?n+" marcados como pagados":"Ya estaban todos pagados");break}
    case "backup":{D.config.ultimaCopia=isoOf(new Date());saveConfig();
      const blob=new Blob([JSON.stringify(D,null,1)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");
      l.href=u;l.download="copia-recibos-"+isoOf(new Date())+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);render();toast("Copia guardada");break}
    case "restore":$("fileRestore").click();break;
    case "salir":auth.signOut();break;
    case "verPet":S.tab="peticiones";render();window.scrollTo(0,0);break;
    case "olvido":{const em=$("lEmail").value.trim();if(!em){$("lErr").hidden=false;$("lErr").textContent="Escribe tu correo y vuelve a pulsar.";break}
      auth.sendPasswordResetEmail(em).then(()=>toast("Te hemos mandado un correo para cambiarla")).catch(()=>{$("lErr").hidden=false;$("lErr").textContent="No se pudo enviar. Revisa el correo."});break}
  }
});

function vistaAlumno(token){
  document.title="Mis clases";
  $("app").classList.add("kid");$("nav").hidden=true;
  $("app").innerHTML=`<div class="loading">Cargando tus clases…</div>`;
  const LSK="peticiones-"+token,LSP="avisos-"+token;
  const mias=()=>{try{return JSON.parse(localStorage.getItem(LSK)||"[]")}catch(e){return []}};
  const guardarMias=l=>{try{localStorage.setItem(LSK,JSON.stringify([...new Set(l)].slice(-30)))}catch(e){}};
  const K={h:null,loc:{},wk:lunes(new Date()),sheet:null,push:false};
  try{K.push=localStorage.getItem(LSP)==="1"}catch(e){}
  const PX=56;

  function sols(){const o={};(K.h.solicitudes||[]).forEach(x=>o[x.id]=Object.assign({tipo:"extra"},x));for(const x of Object.values(K.loc))o[x.id]=Object.assign({tipo:"extra"},x);return Object.values(o)}
  const abiertas=()=>sols().filter(x=>["pendiente","propuesta","confirmada"].includes(x.estado)||(x.tipo==="falta"&&x.estado==="aviso"));
  function bloques(){
    const out=[];const ab=abiertas();
    const faltaEn=new Set(ab.filter(x=>x.tipo==="falta").map(x=>x.f));
    const cambioDe=new Map(ab.filter(x=>x.tipo==="cambio"&&x.de).map(x=>[x.de.f,x]));
    for(const c of K.h.clases){
      let cls=c.extra?"extra":"",lab=c.extra?"Extra":"";
      if(faltaEn.has(c.f)){cls="off";lab="No vas"}
      else if(cambioDe.has(c.f)){const x=cambioDe.get(c.f);cls=x.estado==="confirmada"?"off":"pend";lab=x.estado==="confirmada"?"Movida":"Cambio pedido"}
      out.push({f:c.f,t:c.t,h:c.h,cls,lab,clase:c});
    }
    for(const x of ab){
      if(x.tipo==="falta"){if(x.aplicada&&x.t)out.push({f:x.f,t:x.t,h:x.h||1,cls:"off",lab:"No vas",sol:x});continue}
      const cls=x.estado==="propuesta"?"prop":x.estado==="confirmada"?"extra":"pend";
      const lab=x.estado==="propuesta"?"Propuesta":x.estado==="confirmada"?"Confirmada":"Pendiente";
      out.push({f:x.f,t:x.t,h:x.h,cls,lab,sol:x});
    }
    return out;
  }
  function gridSemana(bl){
    const dias=[...Array(7)].map((_,i)=>{const d=new Date(K.wk);d.setDate(d.getDate()+i);return d});
    const isos=dias.map(isoOf);const sem=bl.filter(b=>isos.includes(b.f));
    const cols=[0,1,2,3,4].concat([5,6].filter(i=>sem.some(b=>b.f===isos[i])));
    const conT=bl.filter(b=>b.t);let mn=16,mx=21;
    if(conT.length){mn=Math.min(...conT.map(b=>Math.floor(toMin(b.t)/60)));mx=Math.max(...conT.map(b=>Math.ceil((toMin(b.t)+b.h*60)/60)))}
    if(mx-mn<3)mx=mn+3;const H=(mx-mn)*PX;const hoyI=hoyIso();
    let html=`<div class="wk" style="grid-template-columns:38px repeat(${cols.length},1fr);--px:${PX}px"><div class="wh"></div>`;
    html+=cols.map(i=>`<div class="wh${isos[i]===hoyI?" hoy":""}">${DIAS_CORTO[i]}<b>${dias[i].getDate()}</b></div>`).join("");
    html+=`<div class="tcol" style="height:${H}px">${[...Array(mx-mn+1)].map((_,k)=>k&&k<mx-mn?`<span style="top:${k*PX}px">${mn+k}:00</span>`:"").join("")}</div>`;
    for(const i of cols){
      const del=sem.filter(b=>b.f===isos[i]&&b.t);
      html+=`<div class="dcol${isos[i]===hoyI?" hoy":""}" style="height:${H}px">${del.map(b=>{const top=(toMin(b.t)-mn*60)/60*PX;const hh=Math.max(b.h*PX-4,22);
        const idx=bl.indexOf(b);return `<button class="blk ${b.cls}${b.f<hoyI?" past":""}" style="top:${top+2}px;height:${hh}px" data-kb="${idx}" aria-label="${fechaLarga(b.f)} ${rango(b.t,b.h)} ${b.lab}"><span>${b.t}</span><span>${finHora(b.t,b.h)}</span>${b.lab?`<small>${b.lab}</small>`:""}</button>`}).join("")}</div>`;
    }
    html+=`</div>`;
    const sinHora=sem.filter(b=>!b.t);
    if(sinHora.length)html+=`<p class="hint" style="margin-top:6px">Sin hora: ${sinHora.map(b=>fechaLarga(b.f)).join(", ")}</p>`;
    return html;
  }
  function limitesSemana(){const fs_=K.h.clases.map(c=>c.f).concat(sols().map(x=>x.f)).sort();const hoyL=lunes(new Date());
    const min=fs_.length?lunes(parseIso(fs_[0])):hoyL;const max=fs_.length?lunes(parseIso(fs_[fs_.length-1])):hoyL;return {min:min<hoyL?min:hoyL,max:max>hoyL?max:hoyL}}
  function pintar(){
    const hoyI=hoyIso();const bl=bloques();
    const prox=bl.filter(b=>b.f>=hoyI&&b.cls!=="off"&&b.cls!=="pend"&&b.cls!=="prop").sort((a,b)=>(a.f+a.t).localeCompare(b.f+b.t))[0];
    const props=sols().filter(x=>x.estado==="propuesta");
    const lim=new Date(Date.now()-21*864e5).toISOString();const avisos=(K.h.avisos||[]).filter(a=>a.fecha>=lim).slice(0,4);
    const fin=new Date(K.wk);fin.setDate(fin.getDate()+6);
    const {min,max}=limitesSemana();
    const lista=sols().filter(x=>x.estado!=="cancelada"&&(x.f>=hoyI||["pendiente","propuesta"].includes(x.estado))).sort((a,b)=>a.f.localeCompare(b.f));
    $("app").innerHTML=`<div><div class="label">Clases con ${esc(K.h.profesora||"tu profesora")}</div><h1>${esc(K.h.nombre)}</h1><p class="hint" style="margin-top:6px">Normalmente: ${esc(K.h.normal)}</p></div>
      ${props.map(x=>`<div class="section"><div class="kprop"><strong>Tu profesora te propone otra hora</strong>
        <span>${esc(fechaLarga(x.f))} · <span class="mono">${rango(x.t,x.h)}</span></span>${x.notaProfe?`<span class="hint">«${esc(x.notaProfe)}»</span>`:""}
        <div class="btns"><button class="btn primary" data-kacept="${x.id}">Aceptar</button><button class="btn" data-kotra="${x.id}">Proponer otra</button><button class="btn ghost" data-kcanc="${x.id}">Ya no la quiero</button></div></div></div>`).join("")}
      <div class="section">${prox?`<div class="next"><span class="label" style="color:inherit;opacity:.8">Próxima clase</span><span class="big">${fechaLarga(prox.f)}</span><span class="mono">${rango(prox.t,prox.h)}</span></div>`:`<div class="empty"><strong>No hay clases apuntadas</strong>Cuando tu profesora apunte las del mes que viene aparecerán aquí.</div>`}</div>
      ${avisos.length?`<div class="section"><h3>Avisos de tu profesora</h3>${avisos.map(a=>`<div class="aviso-k"><span>${esc(a.texto)}</span><small>${fmtFecha(a.fecha.slice(0,10))}</small></div>`).join("")}</div>`:""}
      <div class="section"><div class="month" style="margin:0"><button class="iconbtn" data-kw="-1" aria-label="Semana anterior" ${K.wk<=min?"disabled":""}>‹</button><h3 class="num">${K.wk.getDate()} ${MESES[K.wk.getMonth()].slice(0,3)} – ${fin.getDate()} ${MESES[fin.getMonth()].slice(0,3)}</h3><button class="iconbtn" data-kw="1" aria-label="Semana siguiente" ${K.wk>=max?"disabled":""}>›</button></div>
        ${gridSemana(bl)}
        <div class="kleg"><span><i style="background:var(--accent)"></i>Clase</span><span><i style="background:var(--ok)"></i>Extra</span><span><i style="border:2px dashed var(--accent)"></i>Pendiente</span><span><i style="background:var(--warn-soft);border:2px solid var(--warn)"></i>Propuesta</span><span><i style="background:var(--hatch)"></i>No vas</span></div>
        <p class="hint">Toca una clase para cambiarla o avisar de que no puedes ir.</p>
        <div class="btns"><button class="btn primary" data-kact="extra">+ Pedir clase extra</button></div></div>
      ${lista.length?`<div class="section"><h3>Tus peticiones</h3><div class="klist">${lista.map(x=>`<div class="kitem"><span class="f">${x.tipo==="falta"?"No vas":x.tipo==="cambio"?"Cambio":"Extra"} · ${fechaLarga(x.f)}${x.t&&x.tipo!=="falta"?` · <span class="mono">${rango(x.t,x.h)}</span>`:""}</span><span class="st ${x.estado==="aceptada"||x.estado==="confirmada"?"aceptada":x.estado==="rechazada"?"rechazada":"pendiente"}">${ESTADO_K[x.estado]||x.estado}</span></div>`).join("")}</div></div>`:""}
      <div class="section"><h3>Avisos en este móvil</h3>${K.push?`<p class="hint"><strong style="color:var(--ok)">Activados.</strong> Te avisaremos cuando tu profesora responda o cambie una clase.</p>`
        :`<p class="hint">Recibe un aviso como un mensaje cuando tu profesora responda o cambie una clase.</p>${pushHint()}<div class="btns"><button class="btn" data-kact="push">Activar avisos</button></div>`}</div>`;
    pintarSheet();
  }
  function pintarSheet(){
    const sh=$("sheet");const s=K.sheet;let html="";
    if(s){
      if(s.k==="clase"){const b=s.b;const sol=b.sol;
        html=cab(fechaLarga(b.f),"kclose")+`<p class="hint mono">${rango(b.t,b.h)}${b.lab?" · "+b.lab:""}</p>`;
        if(sol&&sol.estado==="pendiente")html+=`<div class="section"><p>Has pedido esto y tu profesora aún no ha respondido.</p><div class="btns"><button class="btn ghost" data-kcanc="${sol.id}">Cancelar mi petición</button></div></div>`;
        else if(sol&&sol.estado==="propuesta")html+=`<div class="section"><div class="btns"><button class="btn primary" data-kacept="${sol.id}">Aceptar esta hora</button><button class="btn" data-kotra="${sol.id}">Proponer otra</button></div></div>`;
        else if(b.cls==="off")html+=`<p class="section">Esta clase no la tienes.</p>`;
        else if(b.f<hoyIso())html+=`<p class="section hint">Esta clase ya ha pasado.</p>`;
        else html+=`<div class="section btns"><button class="btn primary" data-kact="cambio">Pedir cambio de día u hora</button><button class="btn" data-kact="falta">No puedo ir</button></div>`;
      }
      if(s.k==="form"){const tipo=s.tipo;const max=new Date();max.setDate(max.getDate()+60);
        const tit=tipo==="extra"?"Pedir clase extra":tipo==="cambio"?"Pedir cambio":tipo==="otra"?"Proponer otra hora":"No puedo ir";
        html=cab(tit,"kclose");
        if(tipo==="falta")html+=`<p class="hint">${fechaLarga(s.b.f)} · ${rango(s.b.t,s.b.h)}</p>
          <div class="section"><span class="label">Motivo</span><div class="chips">${MOTIVOS.map(m=>`<button class="chip" data-kmot="${m}" aria-pressed="${s.mot===m}">${m}</button>`).join("")}</div>
          <div class="field"><label class="label" for="kNota">Algo más (opcional)</label><input id="kNota" maxlength="200" placeholder="Ej.: tengo fiebre"></div>
          <p class="err" id="kErr" hidden></p><div class="btns"><button class="btn primary" data-kact="enviarFalta">Avisar a mi profesora</button></div>
          <p class="hint">Tu profesora recibe el aviso. No hace falta que lo acepte.</p></div>`;
        else{const d=s.d||{};
          html+=`${tipo==="cambio"?`<p class="hint">Ahora: ${fechaLarga(s.b.f)} · ${rango(s.b.t,s.b.h)}</p>`:""}
          <form class="section" id="kForm"><div class="formrow">
            <div class="field"><label class="label" for="kFecha">Día</label><input type="date" id="kFecha" required min="${hoyIso()}" max="${isoOf(max)}" value="${d.f||""}"></div>
            <div class="field"><label class="label" for="kHora">Hora</label><input type="time" id="kHora" required step="900" value="${d.t||""}"></div>
            <div class="field"><label class="label" for="kHoras">Duración</label><select id="kHoras">${durOpts(d.h||K.h.horas||1)}</select></div></div>
            <div class="field"><label class="label" for="kNota">Mensaje (opcional)</label><input id="kNota" maxlength="200" placeholder="Ej.: tengo examen el jueves"></div>
            <p class="err" id="kErr" hidden></p>
            <button class="btn primary" type="submit">Enviar a mi profesora</button>
            <p class="hint">Tu profesora decide. Si no puede, te propondrá otra hora aquí mismo.</p></form>`}
      }
    }
    if(html){$("sheetBody").innerHTML=html}
    sh.hidden=!html;document.body.style.overflow=html?"hidden":"";
  }
  function avisarProfe(titulo,cuerpo){fs.collection("avisos").add({para:"profesora",owner:K.h.owner,token,titulo:titulo.slice(0,90),cuerpo:cuerpo.slice(0,280),creado:ahora()}).catch(e=>console.error(e))}
  async function crear(tipo,{f,t,h,nota,de,motivo}){
    const id=randId(20);const now=ahora();
    const data={owner:K.h.owner,token,alumnoId:K.h.alumnoId,nombre:K.h.nombre,tipo,f,t,h,nota:nota||"",estado:tipo==="falta"?"aviso":"pendiente",por:"alumno",creada:now,actualizada:now,aplicada:false};
    if(de)data.de=de;if(motivo)data.motivo=motivo;
    await fs.collection("solicitudes").doc(id).set(data);
    K.loc[id]=Object.assign({id},data);guardarMias([...mias(),id]);
    return data;
  }
  async function actualizar(x,cambios){
    const upd=Object.assign({},cambios,{por:"alumno",actualizada:ahora()});
    await fs.collection("solicitudes").doc(x.id).update(upd);
    K.loc[x.id]=Object.assign({},x,upd);guardarMias([...mias(),x.id]);
  }
  const errK=(m)=>{const el=$("kErr");if(el){el.hidden=false;el.textContent=m}};
  const solPor=id=>sols().find(x=>x.id===id);
  document.addEventListener("click",async e=>{
    const t=e.target.closest("button");if(!t||t.disabled)return;const ds=t.dataset;
    if(ds.kw){K.wk.setDate(K.wk.getDate()+7*Number(ds.kw));pintar();return}
    if(ds.kb!==undefined){K.sheet={k:"clase",b:bloques()[Number(ds.kb)]};pintarSheet();return}
    if(ds.kmot){K.sheet.mot=ds.kmot;const n=$("kNota").value;pintarSheet();$("kNota").value=n;return}
    if(ds.kotra){const x=solPor(ds.kotra);K.sheet={k:"form",tipo:"otra",sol:x,d:{f:x.f,t:x.t,h:x.h}};pintarSheet();return}
    if(ds.kacept){const x=solPor(ds.kacept);t.disabled=true;try{await actualizar(x,{estado:"confirmada"});avisarProfe(K.h.nombre+" acepta tu propuesta",descrK(x));K.sheet=null;pintar();toast("Hecho. Tu clase queda apuntada.")}catch(err){console.error(err);t.disabled=false;toast("No se pudo enviar. Revisa la conexión.")}return}
    if(ds.kcanc){const x=solPor(ds.kcanc);t.disabled=true;try{await actualizar(x,{estado:"cancelada"});avisarProfe(K.h.nombre+" cancela su petición",descrK(x));K.sheet=null;pintar();toast("Petición cancelada")}catch(err){console.error(err);t.disabled=false;toast("No se pudo enviar. Revisa la conexión.")}return}
    switch(ds.kact){
      case "kclose":break;
      case "extra":K.sheet={k:"form",tipo:"extra"};pintarSheet();break;
      case "cambio":K.sheet={k:"form",tipo:"cambio",b:K.sheet.b,d:{h:K.sheet.b.h}};pintarSheet();break;
      case "falta":K.sheet={k:"form",tipo:"falta",b:K.sheet.b};pintarSheet();break;
      case "enviarFalta":{const s=K.sheet;if(!s.mot){errK("Elige un motivo.");break}t.disabled=true;
        const extra=$("kNota").value.trim();const motivo=s.mot+(extra?": "+extra:"");
        try{await crear("falta",{f:s.b.f,t:s.b.t,h:s.b.h,motivo});avisarProfe(K.h.nombre+" no vendrá","El "+fechaLarga(s.b.f)+" ("+rango(s.b.t,s.b.h)+"). "+motivo);K.sheet=null;pintar();toast("Aviso enviado a tu profesora")}
        catch(err){console.error(err);t.disabled=false;errK("No se pudo enviar. Revisa la conexión.")}break}
      case "push":{t.disabled=true;try{const tok=await obtenerToken(true);await fs.collection("pushAlumnos").doc(token).set({tokens:firebase.firestore.FieldValue.arrayUnion(tok),actualizado:ahora()},{merge:true});K.push=true;try{localStorage.setItem(LSP,"1")}catch(x){}toast("Avisos activados")}catch(err){console.error(err);toast(errorPush(err))}pintar();break}
    }
    if(ds.act==="kclose"){K.sheet=null;pintarSheet()}
  });
  function descrK(x){return fechaLarga(x.f)+(x.t?" "+rango(x.t,x.h):"")}
  document.addEventListener("submit",async e=>{
    if(e.target.id!=="kForm")return;e.preventDefault();
    const s=K.sheet;const f=$("kFecha").value,t=$("kHora").value,h=Number($("kHoras").value),nota=$("kNota").value.trim().slice(0,200);
    if(!f||f<hoyIso()){errK("Elige un día a partir de hoy.");return}
    if(!t){errK("Elige la hora.");return}
    const btn=e.target.querySelector("[type=submit]");btn.disabled=true;
    try{
      if(s.tipo==="otra"){await actualizar(s.sol,{estado:"pendiente",f,t,h,nota});avisarProfe(K.h.nombre+" propone otra hora",fechaLarga(f)+" "+rango(t,h)+(nota?". "+nota:""))}
      else if(s.tipo==="cambio"){await crear("cambio",{f,t,h,nota,de:{f:s.b.f,t:s.b.t,h:s.b.h}});avisarProfe(K.h.nombre+" pide un cambio","Del "+fechaLarga(s.b.f)+" al "+fechaLarga(f)+" "+rango(t,h)+(nota?". "+nota:""))}
      else{await crear("extra",{f,t,h,nota});avisarProfe(K.h.nombre+" pide una clase extra",fechaLarga(f)+" "+rango(t,h)+(nota?". "+nota:""))}
      K.sheet=null;pintar();toast("Enviado. Tu profesora te responderá aquí.");
    }catch(err){console.error(err);btn.disabled=false;errK("No se pudo enviar. Revisa la conexión y prueba otra vez.")}
  });
  fs.collection("horarios").doc(token).get().then(async d=>{
    if(!d.exists){$("app").innerHTML=`<div class="login"><h1>Enlace no válido</h1><p class="hint">Este enlace ya no funciona. Pide uno nuevo a tu profesora.</p></div>`;return}
    K.h=d.data();K.h.clases=K.h.clases||[];
    const pub=new Map((K.h.solicitudes||[]).map(x=>[x.id,x]));
    const ids=new Set([...mias(),...[...pub.values()].filter(x=>["pendiente","propuesta","confirmada","aviso"].includes(x.estado)).map(x=>x.id)]);
    await Promise.all([...ids].map(id=>fs.collection("solicitudes").doc(id).get().then(s=>{if(s.exists)K.loc[id]=Object.assign({id},s.data())}).catch(()=>{})));
    const {min}=limitesSemana();if(K.wk<min)K.wk=min;
    pintar();
    if(K.push)obtenerToken(false).then(tok=>{if(tok)fs.collection("pushAlumnos").doc(token).set({tokens:firebase.firestore.FieldValue.arrayUnion(tok),actualizado:ahora()},{merge:true})}).catch(()=>{});
  }).catch(err=>{console.error(err);$("app").innerHTML=`<div class="login"><h1>No se pudo cargar</h1><p class="hint">Revisa la conexión y vuelve a abrir el enlace.</p></div>`});
}
})();
</script>
</body>
</html>
